<script>
// 言葉の切り替え。HTMLに書いた英語が元で、日本語はここに置く。
// 下書きでは ?lang=jaで日本語にする。ブラウザの言葉で勝手に切り替えない（Googleの多言語サイトの指針）。
// 公開する時は、英語をtegami.chat/、日本語をtegami.chat/ja/ の別のページに書き出し、hreflangで結ぶ。
const JA = {
};
const EN = {};
document.querySelectorAll('[data-i18n]').forEach((el) => { EN[el.dataset.i18n] ??= el.innerHTML; });

function pick() {
  return new URLSearchParams(location.search).get('lang') === 'ja' ? 'ja' : 'en';
}
function apply(lang) {
  const dict = lang === 'ja' ? JA : EN;
  document.querySelectorAll('[data-i18n]').forEach((el) => {
    const v = dict[el.dataset.i18n] ?? EN[el.dataset.i18n];
    if (v != null) el.innerHTML = v;
  });
  document.documentElement.lang = lang;

  document.querySelectorAll('a[href]').forEach((a) => {
    const h = a.getAttribute('href');
    if (!h || /^(https?:|mailto:|#|\?)/.test(h) || a.dataset.lang) return;
    a.dataset.base ??= h;
    const [path, hash] = a.dataset.base.split('#');
    a.setAttribute('href', path + (lang === 'ja' ? '?lang=ja' : '') + (hash ? '#' + hash : ''));
  });
  document.querySelectorAll('[data-lang]').forEach((a) => {
    const on = a.dataset.lang === lang;
    a.className = 'block px-4 py-2 text-sm ' + (on
      ? 'font-semibold text-forest-600 dark:text-forest-300'
      : 'text-neutral-700 hover:bg-neutral-100 dark:text-neutral-300 dark:hover:bg-white/5');
    if (on) a.setAttribute('aria-current', 'true'); else a.removeAttribute('aria-current');
  });
}
apply(pick());
document.addEventListener('click', (e) => {
  document.querySelectorAll('[data-lang-menu][open]').forEach((d) => { if (!d.contains(e.target)) d.removeAttribute('open'); });
});

document.querySelectorAll('[data-theme-set]').forEach((b) => {
  b.onclick = () => {
    const dark = b.dataset.themeSet === 'dark';
    document.documentElement.classList.toggle('dark', dark);
    try { localStorage.setItem('tegami.theme', b.dataset.themeSet); } catch {}
  };
});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
  let t; try { t = localStorage.getItem('tegami.theme'); } catch {}
  if (!t) document.documentElement.classList.toggle('dark', e.matches);
});
</script>
